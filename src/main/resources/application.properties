# cSpell:disable

# Imports (opcional: si no existe private.properties se usan las prop. de entorno)
spring.config.import=optional:classpath:config/private.properties

# Configuraciones de la aplicacion
spring.application.name=purchases-service
server.port=8081
# Usa los headers X-Forwarded-* del gateway para generar el server url de OpenAPI
server.forward-headers-strategy=framework

# Eureka (descubrimiento dinamico)
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Swagger / OpenAPI
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# Base de datos
spring.datasource.url=${db.url}?user=${db.username}&password=${db.password}&prepareThreshold=${db.prepareThreshold:0}

# Jpa
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Liquibase Migrations
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.enabled=false

# Logs (configurables: rutas y niveles)
logging.file.name=logs/purchases-service.log
logging.level.com.bigobooks=INFO
logging.level.org.springframework.data.repository=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Paginacion estandar del equipo
spring.data.web.pageable.default-page-size=25
spring.data.web.pageable.max-page-size=100

# CONFIGURACIÓN REDIS CACHE (UPSTASH)
spring.data.redis.ssl.enabled=true
spring.cache.type=redis

# Políticas de retención:
# Compras: TTL limitado en minutos (datos transaccionales de alta rotación)
app.cache.ttl.purchases-minutes=15