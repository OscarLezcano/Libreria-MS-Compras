# cSpell:disable

# Imports (opcional: si no existe private.properties se usan las prop. de entorno)
spring.config.import=optional:classpath:config/private.properties

# Configuraciones de la aplicacion
spring.application.name=purchases-service
server.port=${purchases.server.port:8083}

# Swagger / OpenAPI
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# Base de datos
# prepareThreshold=0: el pooler de Supabase (pgbouncer) no soporta prepared statements.
spring.datasource.url=${db.url}?user=${db.username}&password=${db.password}&prepareThreshold=${db.prepareThreshold:0}

# Jpa
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Liquibase Migrations
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.enabled=false

# Logs (configurables: rutas y niveles)
purchases.log.path=logs
purchases.log.file=purchases-service.log
purchases.log.level.com.bigobooks=INFO
purchases.log.level.repositories=DEBUG
purchases.log.level.sql=DEBUG

# Paginacion estandar del equipo
app.pagination.page-size=25
app.pagination.max-size=100