# cSpell:disable

# Imports (opcional: si no existe private.properties se usan las prop. de entorno)
spring.config.import=optional:classpath:config/private.properties

# Configuraciones de la aplicacion
spring.application.name=purchases-service
server.port=8081
# Usa los headers X-Forwarded-* del gateway para generar el server url de OpenAPI
server.forward-headers-strategy=framework

# Eureka (descubrimiento dinamico)
eureka.client.service-url.defaultZone=${eureka.default-zone:http://localhost:8761/eureka/}

# Swagger / OpenAPI
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# Base de datos
spring.datasource.url=${db.url}?user=${db.username}&password=${db.password}&prepareThreshold=${db.prepareThreshold:0}

# Jpa
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Liquibase Migrations
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.enabled=false

# Logs (configurables: rutas y niveles)
logging.file.name=logs/purchases-service.log
logging.level.com.bigobooks=INFO
logging.level.org.springframework.data.repository=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Paginacion estandar del equipo
spring.data.web.pageable.default-page-size=25
spring.data.web.pageable.max-page-size=100

# CONFIGURACIÓN REDIS CACHE
spring.data.redis.ssl.enabled=true
spring.cache.type=redis

# Políticas de retención dinámicas leídas por CacheProperties:
# 'suppliers' con 0s indica persistencia (no expira automáticamente)
cache.ttl.suppliers=0s
# 'purchases' con 15m aplica el TTL limitado exigido por la consigna
cache.ttl.purchases=15m

# Seguridad autorizacion por roles (Purchases)
security.jwt.allow-cookie=false
security.public-paths=/v3/api-docs/**,/swagger-ui/**,/swagger-ui.html,/error
security.roles.purchases-view=ADMIN,VENDEDOR
security.roles.purchases-manage=ADMIN,VENDEDOR
security.roles.purchases-status=ADMIN
security.roles.purchases-delete=ADMIN
security.roles.suppliers-view=ADMIN,VENDEDOR
security.roles.suppliers-manage=ADMIN
security.roles.suppliers-delete=ADMIN

spring.output.ansi.enabled=always
